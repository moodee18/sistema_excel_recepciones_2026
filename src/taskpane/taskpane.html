<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asistente de Recepciones PDF</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
    
    <!-- PDF.js para lectura de PDFs en el cliente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <link rel="stylesheet" href="taskpane.css" />
</head>

<body>
    <header class="app-header">
        <div class="logo-container">

            <h2>ExtracciÃ³n de Recepciones</h2>

        <p class="subtitle">Carga de facturas, remisiones y certificados a <code>recepciones_2026</code></p>
    </header>

    <main class="app-content">
        <!-- Zona Drag and Drop -->
        <div id="drop-zone" class="drop-zone">

        <!-- Estado / Progreso -->

            </div>
            
            <div id="items-container" class="items-list"></div>

            <!-- Botones de AcciÃ³n -->
            <div class="actions-container">
                <button id="btn-insert" class="btn btn-primary">
                    <span>ðŸ“¥</span> Volcar a Hoja recepciones_2026

            </div>
        </div>

        <!-- Alertas y Mensajes -->

    </main>

    <footer class="app-footer">
        <span>Sincronizado con libro <strong>recepciones_2026.xlsx</strong></span>
    </footer>

    <script src="taskpane.js"></script>
</body>
</html>
